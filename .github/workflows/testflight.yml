name: TestFlight (archive, sign, upload, wait until installable)

# Signing secrets live in DART-Skyboard/ArcLake-iOS (the same team key,
# distribution certificate and keychain password that build Arc Lake, Ash Tree
# IDE and DART). ArcLake-iOS/.github/workflows/dartmeadow-testflight.yml calls
# this workflow and passes them in explicitly; nothing is stored here.
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: main
    secrets:
      APP_STORE_CONNECT_API_KEY_CONTENT: { required: true }
      APP_STORE_CONNECT_ISSUER_ID: { required: true }
      CERTIFICATE_BASE64: { required: true }
      CERTIFICATE_PASSWORD: { required: true }
      KEYCHAIN_PASSWORD: { required: false }
  workflow_dispatch:
    inputs:
      ref:
        type: string
        default: main

env:
  BUNDLE_ID: com.dartmeadow.jots
  TEAM_ID: L7AHWS9Q6V
  ASC_KEY_ID: NQXQ595W59

jobs:
  # ── Archive, sign, upload to TestFlight, wait until installable ──
  testflight:
    name: Archive & TestFlight
    runs-on: macos-15
    timeout-minutes: 140
    steps:
      - name: Check signing secrets
        env:
          K: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          I: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          C: ${{ secrets.CERTIFICATE_BASE64 }}
          P: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          miss=""
          [ -n "$K" ] || miss="$miss APP_STORE_CONNECT_API_KEY_CONTENT"
          [ -n "$I" ] || miss="$miss APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$C" ] || miss="$miss CERTIFICATE_BASE64"
          [ -n "$P" ] || miss="$miss CERTIFICATE_PASSWORD"
          if [ -n "$miss" ]; then
            {
              echo "### TestFlight blocked: missing repository secrets"
              echo "Run this through DART-Skyboard/ArcLake-iOS → Actions → \"Build DART Meadow (dartmeadow-ios) for TestFlight\", which passes its signing secrets in:"
              for s in $miss; do echo "- \`$s\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::missing secrets:$miss"; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: dartsolarpunk/dartmeadow-ios
          ref: ${{ inputs.ref || 'main' }}

      - name: Select Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Install App Store Connect API key
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys ~/private_keys
          printf '%s' "$ASC_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          cp ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8 ~/private_keys/
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          [ "$(wc -c < ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8)" -gt 100 ] || { echo "API key secret looks empty"; exit 1; }

      - name: Keychain + distribution certificate
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KC=$RUNNER_TEMP/signing.keychain-db; KP="${KEYCHAIN_PASSWORD:-keychainpass}"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "$CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k "$KC" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" >/dev/null
          security find-identity -v -p codesigning "$KC"

      - name: Provision (bundle ID, Sign in with Apple, profile, app record)
        id: prov
        env:
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          pip3 install --quiet --break-system-packages 'PyJWT[crypto]>=2.8' requests 2>/dev/null || pip3 install --quiet 'PyJWT[crypto]>=2.8' requests
          export ASC_KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8 OUT=$RUNNER_TEMP/asc
          set +e; python3 scripts/asc.py provision; rc=$?; set -e
          [ "$rc" = 0 ] || [ "$rc" = 3 ] || exit $rc
          echo "app_ready=$([ "$rc" = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          UUID=$(cat $OUT/uuid.txt); NAME=$(cat $OUT/name.txt)
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp $OUT/profile.mobileprovision "$d/$UUID.mobileprovision"; done
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV
          echo "PROFILE_NAME=$NAME" >> $GITHUB_ENV

      - name: Install XcodeGen + generate
        run: |
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip -o /tmp/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen_bin
          sudo cp /tmp/xcodegen_bin/xcodegen/bin/xcodegen /usr/local/bin/xcodegen
          xcodegen generate --spec project.yml
          echo "BUILD_NUMBER=$(date +%s)" >> $GITHUB_ENV

      - name: Archive (Release, manual signing)
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -o pipefail
          security unlock-keychain -p "${KEYCHAIN_PASSWORD:-keychainpass}" $RUNNER_TEMP/signing.keychain-db
          xcodebuild archive -project DartMeadow.xcodeproj -scheme DartMeadow -configuration Release \
            -destination "generic/platform=iOS" -archivePath $RUNNER_TEMP/DartMeadow.xcarchive \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/signing.keychain-db" 2>&1 | tee archive.log | grep -E "error:|ARCHIVE" || true
          test -d $RUNNER_TEMP/DartMeadow.xcarchive/Products/Applications/DartMeadow.app || { grep -B2 -A8 "error:" archive.log | head -150; exit 1; }

      - name: Package IPA + verify Sign in with Apple entitlement
        run: |
          APP=$RUNNER_TEMP/DartMeadow.xcarchive/Products/Applications/DartMeadow.app
          codesign -d --entitlements :- "$APP" > $RUNNER_TEMP/ents.plist 2>/dev/null
          cat $RUNNER_TEMP/ents.plist
          grep -q com.apple.developer.applesignin $RUNNER_TEMP/ents.plist || { echo "::error::signed app lacks applesignin"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
          mkdir -p $RUNNER_TEMP/Payload && cp -R "$APP" $RUNNER_TEMP/Payload/
          (cd $RUNNER_TEMP && zip -qry DartMeadow.ipa Payload)
          ls -la $RUNNER_TEMP/DartMeadow.ipa

      - name: Upload to TestFlight
        if: steps.prov.outputs.app_ready == 'true'
        env:
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcrun altool --upload-app --type ios --file $RUNNER_TEMP/DartMeadow.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee altool.log
          if grep -qiE "Failed to upload package|ERROR: \[ContentDelivery|UPLOAD FAILED|Validation failed" altool.log; then
            echo "::error::altool reported an error"; exit 1; fi
          echo "### Uploaded build $BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait until installable in TestFlight
        if: steps.prov.outputs.app_ready == 'true'
        env:
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          export ASC_KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8 OUT=$RUNNER_TEMP/asc
          python3 scripts/asc.py wait "$BUILD_NUMBER"

      - name: App record missing
        if: steps.prov.outputs.app_ready != 'true'
        run: |
          echo "::error::Signed archive built, but there is no App Store Connect app for $BUNDLE_ID yet. Create it (App Store Connect → Apps → + New App, bundle ID $BUNDLE_ID) and re-run."
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-logs
          path: |
            archive.log
            altool.log
          if-no-files-found: ignore
