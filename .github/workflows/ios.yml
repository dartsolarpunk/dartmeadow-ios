name: iOS build (Simulator smoke test)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

env:
  BUNDLE_ID: com.dartmeadow.jots
  TEAM_ID: L7AHWS9Q6V
  ASC_KEY_ID: NQXQ595W59

jobs:
  # ── Compile + boot the game in the iOS Simulator (no secrets needed) ──
  simulator:
    name: Build & smoke-test (Simulator)
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip -o /tmp/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen_bin
          sudo cp /tmp/xcodegen_bin/xcodegen/bin/xcodegen /usr/local/bin/xcodegen
          xcodegen generate --spec project.yml

      - name: Build for Simulator
        run: |
          set -o pipefail
          xcodebuild build -project DartMeadow.xcodeproj -scheme DartMeadow -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|warning: .*Swift|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log || { grep -B2 -A6 "error:" build.log | head -150; exit 1; }
          du -sh build/Build/Products/Debug-iphonesimulator/DartMeadow.app

      - name: Boot game in Simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[(k,x) for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          c.sort(key=lambda t:t[0]); print(c[-1][1]['udid'])")
          echo "Simulator $UDID"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/DartMeadow.app
          (xcrun simctl spawn "$UDID" log stream --style compact --level debug --predicate 'process == "DartMeadow"' > sim.log 2>&1 &)
          sleep 3
          xcrun simctl launch "$UDID" com.dartmeadow.jots -dmSmoke
          mkdir -p shots
          sleep 20; xcrun simctl io "$UDID" screenshot shots/01-splash.png
          sleep 15; xcrun simctl io "$UDID" screenshot shots/02-graphics.png
          sleep 15; xcrun simctl io "$UDID" screenshot shots/03-menu.png
          sleep 40; xcrun simctl io "$UDID" screenshot shots/04-flight.png
          sleep 50; xcrun simctl io "$UDID" screenshot shots/05-flight-later.png
          pkill -f "log stream" || true
          echo "── JS console (first 300 lines) ──"
          grep -E "\[JS |\[scheme\]|\[game\]|\[SIWA\]" sim.log | head -300 || true
          echo "── errors ──"
          grep -E "\[JS error\]" sim.log | head -60 || true
          grep -q "\[dm-ios\] boot" sim.log || { echo "::error::game page never booted in the simulator"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-smoke
          path: |
            shots/
            sim.log
            build.log
          if-no-files-found: ignore
