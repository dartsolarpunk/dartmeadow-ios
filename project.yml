name: DartMeadow
options:
  bundleIdPrefix: com.dartmeadow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: L7AHWS9Q6V
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    DM_SIWA_SERVICE_URL: "https://dartmeadow-siwa.vercel.app/api"   # server/siwa on Vercel (project dartmeadow-siwa)

targets:
  DartMeadow:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Bridge/**"
          - "**/*.entitlements"
      - path: App/Bridge/dm-ios-bridge.js
        type: file
        buildPhase: resources
      # The whole game, copied as a folder named Web at the .app root
      - path: Web
        type: folder
        buildPhase: resources
      - path: WEB_VERSION
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: DartMeadow
        PRODUCT_BUNDLE_IDENTIFIER: com.dartmeadow.jots
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/DartMeadow.entitlements
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          CODE_SIGN_IDENTITY: "iPhone Distribution"

schemes:
  DartMeadow:
    build:
      targets:
        DartMeadow: all
    run:
      config: Debug
    archive:
      config: Release
